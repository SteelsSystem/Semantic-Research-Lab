name: Windows Release (.EXE Setup Wizard & MSI)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows .EXE Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Generate multi-platform icons
        run: python scripts/generate-icons.py

      - name: Run DSP unit test suite
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Build Tauri Windows native desktop (.EXE & .MSI)
        run: npx tauri build
        continue-on-error: true

      - name: Build portable distribution package
        run: node scripts/package-portable.js

      - name: Determine release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish Windows Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: VaporSphere Windows Release (${{ steps.vars.outputs.tag }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            releases/*win*.zip
            releases/*portable*.*
          body: |
            ### VaporSphere Dialectical Lab - Windows Release
            Autonomous Socratic Elenctics, OKLab Acoustic Particle Engine & Local Intelligence.

            #### 🪟 Quick Installation on Windows
            **Method A — Run the .EXE Setup Wizard:**
            1. Download `VaporSphere_*_x64-setup.exe` from the assets below.
            2. Double-click to launch the setup wizard (creates Desktop and Start Menu shortcuts).

            **Method B — 1-Line PowerShell Installation:**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-windows.ps1 | iex
            ```

            **Method C — 1-Line Command Prompt (CMD):**
            ```cmd
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-windows.cmd -o install.cmd && install.cmd
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
