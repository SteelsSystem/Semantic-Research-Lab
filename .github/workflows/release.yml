name: Multi-Platform Release (macOS, Linux, Windows)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

jobs:
  build-and-publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macOS (Universal DMG)'
            tauri_args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux (CachyOS/Arch/Ubuntu/Debian AppImage & deb)'
            tauri_args: ''
          - platform: 'windows-latest'
            os_name: 'Windows (x64 .EXE & MSI)'
            tauri_args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies (WebKitGTK, AppIndicator, SSL)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate multi-platform icon assets
        run: python3 scripts/generate-icons.py || python scripts/generate-icons.py

      - name: Run Vitest DSP math unit tests
        run: npm test

      - name: Build frontend assets
        run: npm run build

      - name: Build Tauri desktop bundle
        run: npx tauri build ${{ matrix.tauri_args }}
        continue-on-error: true

      - name: Build portable distribution package
        run: node scripts/package-portable.js

      - name: Determine release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish multi-platform release assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: VaporSphere Multi-Platform Release (${{ steps.vars.outputs.tag }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            releases/*.*
          body: |
            ### VaporSphere Dialectical Research Lab - Multi-Platform Release
            Autonomous Socratic Elenctics, OKLab Acoustic Particle Engine & Local Offline Intelligence.

            #### 🚀 Quick 1-Line Installation Commands

            **🐧 Linux (CachyOS / Arch / Ubuntu / Debian / Fedora / AppImage):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```
            *CachyOS / Arch Linux Native Package:*
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/PKGBUILD -o PKGBUILD && makepkg -si
            ```

            **🍎 macOS (Apple Silicon & Intel Universal DMG):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-macos.sh | bash
            ```

            **🪟 Windows (.EXE Setup Installer & PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-windows.ps1 | iex
            ```
            *Command Prompt (CMD) direct run:*
            ```cmd
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-windows.cmd -o install.cmd && install.cmd
            ```

            #### 📦 Release Assets Included
            - **Windows**: `VaporSphere_*_x64-setup.exe` (NSIS Installer), `.msi`, portable `.zip`
            - **Linux**: `.AppImage`, `.deb`, CachyOS/Arch bundle, portable `tar.gz`
            - **macOS**: `.dmg` (Universal binary for M1-M4 & Intel), portable `tar.gz`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
